<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070D22">
<title>تشكيلة الفريق</title>
<link rel="icon" href="coach.jpg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: a full illustrated stadium cover with two entrances (player, coach); inside, a lineup page with pitch, bench, note and an updates feed. */
html { -webkit-text-size-adjust: 100%; }
:root {
  --bg: #EDF1EA;
  --surface: #F8FAF6;
  --ink: #12241A;
  --muted: #566A5C;
  --line: #CBD6C8;
  --pitch: #1F6B3A;
  --pitch-alt: #1B6133;
  --chalk: #F2F7EE;
  --bib: #F2C230;
  --bib-ink: #2A2200;
  --gk: #0F2A1B;
  --danger: #B3261E;
  --font-display: "Reem Kufi", "Segoe UI", Tahoma, sans-serif;
  --font-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B130F; --surface: #13201A; --ink: #E7EFE8; --muted: #92A798; --line: #243529;
    --pitch: #17552F; --pitch-alt: #134A29; --gk: #0A1A12; --danger: #FF8A80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B130F; --surface: #13201A; --ink: #E7EFE8; --muted: #92A798; --line: #243529;
  --pitch: #17552F; --pitch-alt: #134A29; --gk: #0A1A12; --danger: #FF8A80; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
[hidden] { display: none !important; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.9rem; line-height: 1.2; margin: 0; text-wrap: balance; }
select, input, textarea, button { font: inherit; color: inherit; }
input, textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; width: 100%;
}
textarea { resize: vertical; min-height: 5.5rem; }
:focus-visible { outline: 3px solid var(--bib); outline-offset: 2px; }
button {
  cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; font-weight: 500;
}
button.primary { background: var(--bib); color: var(--bib-ink); border-color: var(--bib); font-weight: 600; }
button.danger { color: var(--danger); }
button:disabled { opacity: .55; cursor: default; }

/* cover */
.hero {
  position: relative; width: 100%; aspect-ratio: 400 / 640; min-height: 540px; border-radius: 16px; overflow: hidden;
  background: #070D22; color: #fff;
}
.hero svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hero-in { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 26px 20px 22px; }
.hero h1 { font-size: 2.5rem; text-shadow: 0 2px 14px rgba(0, 0, 0, .55); }
.hero .sub { margin: 6px 0 0; font-size: 1.02rem; color: #DCE3F5; text-shadow: 0 1px 8px rgba(0, 0, 0, .6); }
.entrances { display: flex; flex-direction: column; gap: 10px; }
.entrances button { width: 100%; padding: 14px 16px; font-size: 1.1rem; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.entrances .player-btn { background: var(--bib); color: var(--bib-ink); border-color: var(--bib); font-weight: 600; }
.entrances .coach-btn { background: rgba(7, 13, 34, .72); color: #fff; border-color: rgba(255, 255, 255, .45); }
.entrances small { font-weight: 400; font-size: .85rem; opacity: .85; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.top button { flex: none; }
.match { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.match .vs { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.match .vs b { font-family: var(--font-display); font-size: 1.5rem; line-height: 1.2; }
.chip { background: var(--bib); color: var(--bib-ink); font-size: .78rem; font-weight: 600; padding: 1px 9px; border-radius: 99px; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 18px; color: var(--muted); font-size: .95rem; }
.facts span { font-variant-numeric: tabular-nums; }
.formation-tag { font-family: var(--font-display); font-size: 1.1rem; color: var(--muted); direction: ltr; unicode-bidi: isolate; }

.pitch {
  position: relative; width: 100%; max-width: 460px; margin: 0 auto; aspect-ratio: 68 / 100; border-radius: 12px; overflow: hidden;
  background: repeating-linear-gradient(to bottom, var(--pitch) 0 10%, var(--pitch-alt) 10% 20%);
}
.pitch svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.pl { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 3px; width: 5.4rem; }
.shirt-wrap { position: relative; width: 2.7rem; height: 2.7rem; }
.shirt {
  width: 100%; height: 100%; border-radius: 50%; background: var(--bib); color: var(--bib-ink); overflow: hidden;
  display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 1.05rem;
  border: 2px solid var(--chalk); font-variant-numeric: tabular-nums;
}
.shirt img { width: 100%; height: 100%; object-fit: cover; display: block; }
.badge {
  position: absolute; bottom: -4px; inset-inline-end: -6px; min-width: 1.25rem; height: 1.25rem; padding: 0 3px; border-radius: 99px;
  background: var(--bib); color: var(--bib-ink); font-family: var(--font-display); font-weight: 700; font-size: .75rem; line-height: 1.25rem;
  text-align: center; border: 1.5px solid var(--chalk); font-variant-numeric: tabular-nums;
}
.pl.gk .shirt { background: var(--gk); color: var(--chalk); }
.pl.empty .shirt { background: transparent; color: var(--chalk); border-style: dashed; opacity: .7; }
.pl .nm {
  color: #fff; font-size: .78rem; font-weight: 600; text-align: center; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  text-shadow: 0 1px 3px rgba(0, 0, 0, .75); padding: 0 2px;
}

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.panel h2 { font-family: var(--font-display); font-size: 1.2rem; margin: 0; }
.subs { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 14px; }
.subs li { display: flex; align-items: center; gap: 8px; min-width: 0; }
.subs .n { font-family: var(--font-display); font-weight: 700; min-width: 1.8rem; text-align: center; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; font-variant-numeric: tabular-nums; }
.subs .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.note { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.muted { color: var(--muted); }
.stamp { color: var(--muted); font-size: .85rem; text-align: center; margin: 0; }
.chip.alt { background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
.notice { border-color: var(--bib); gap: 10px; }
.roster { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.roster li { display: grid; grid-template-columns: 2.2rem minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); }
.roster li:first-child { border-top: 0; }
.rn { font-family: var(--font-display); font-weight: 700; text-align: center; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; font-variant-numeric: tabular-nums; }
.rname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.coachcard { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.coach-img { width: 84px; height: 84px; flex: none; border-radius: 50%; object-fit: cover; object-position: 50% 20%; border: 3px solid var(--bib); display: block; }
.coach-txt { display: flex; flex-direction: column; min-width: 0; color: var(--muted); }
.coach-txt b { font-family: var(--font-display); font-size: 1.6rem; line-height: 1.2; color: var(--ink); overflow-wrap: anywhere; }
.empty-state { text-align: center; padding: 36px 16px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.empty-state p { margin: 0; max-width: 32ch; }
.stack { display: flex; flex-direction: column; gap: 20px; }

.feed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.feed li + li { border-top: 1px solid var(--line); }
.feed button { width: 100%; text-align: start; background: transparent; border: 0; border-radius: 6px; padding: 10px 4px; display: flex; flex-direction: column; gap: 0; }
.feed button[aria-current="true"] { background: var(--bg); }
.feed .t1 { font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.feed .t2 { color: var(--muted); font-size: .85rem; }

.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.editor { display: flex; flex-direction: column; gap: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: .88rem; color: var(--muted); min-width: 0; }
.rows { display: flex; flex-direction: column; gap: 6px; }
.row { display: grid; grid-template-columns: 3rem 3rem minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.row .role { font-size: .85rem; color: var(--muted); }
.row input.num { text-align: center; font-variant-numeric: tabular-nums; padding-inline: 4px; }
.photo-cell { display: flex; gap: 4px; align-items: center; }
.photo-cell button { padding: 0; width: 2.4rem; height: 2.4rem; border-radius: 50%; overflow: hidden; display: grid; place-items: center; font-size: .72rem; }
.photo-cell button.x { width: 1.7rem; height: 1.7rem; border-radius: 6px; font-size: .9rem; color: var(--danger); }
.photo-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
.msg { min-height: 1.4em; font-size: .9rem; color: var(--muted); margin: 0; }
.msg.err { color: var(--danger); }
@media (max-width: 380px) { .grid2 { grid-template-columns: minmax(0, 1fr); } .hero h1 { font-size: 2.1rem; } }
@media (prefers-reduced-motion: no-preference) { .pl { transition: left .35s ease, top .35s ease; } }
</style>
</head>

  function current() { for (var i = 0; i < lineups.length; i++) if (lineups[i].id === selectedId) return lineups[i]; return null; }

  function section(title, body) { return h("section", { class: "panel" }, [h("h2", { text: title }), body]); }

  function renderView() {

    if (editing) { viewEl.appendChild(buildPitch(draft)); return; }
    var stack = h("div", { class: "stack" });
    viewEl.appendChild(stack);
    if (notice && coachMode()) {

        h("b", { text: notice }),
        h("div", { class: "actions" }, [
          h("button", { type: "button", class: "primary", text: "عرض كما يراها اللاعبون", onclick: function () { go("player"); } }),
          h("button", { type: "button", text: "إخفاء", onclick: function () { notice = ""; render(); } })
        ])
      ]));
    }
    if (dbFailed) { stack.appendChild(h("div", { class: "panel empty-state" }, [h("p", { text: "تعذّر الاتصال بالخادم. تحقق من الإنترنت ثم اضغط «تحديث»." })])); return; }
    if (!loaded) { stack.appendChild(h("div", { class: "panel empty-state" }, [h("p", { class: "muted", text: "جارٍ تحميل التشكيلة…" })])); return; }
    var cur = current();
    if (!cur) {
      var kids = [h("p", { text: coachMode() ? "لم تنشر أي تشكيلة بعد. اضغط الزر لتضع تشكيلة المباراة القادمة." : "لم ينزّل المدرب أي تشكيلة بعد. ستظهر هنا فور نشرها." })];
      if (coachMode()) kids.push(h("button", { type: "button", class: "primary", text: "تشكيلة جديدة", onclick: function () { startEdit(null); } }));

    }
    var cd = countdown(cur);
    var vs = h("div", { class: "vs" }, [

      cd ? h("span", { class: "chip alt", text: cd }) : null,

  document.getElementById("enterPlayer").addEventListener("click", function () { go("player"); });

  document.getElementById("refreshBtn").addEventListener("click", function () { refreshLineups(true); });
  function api(method, path, body) {
    var headers = { "content-type": "application/json" };

    return fetch(path, { method: method, headers: headers, body: body ? JSON.stringify(body) : undefined, cache: "no-store" }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {

  function go(name) {

  /* a new post always sorts first, even when this device's clock is behind an older post */
  function nextStamp() {

  }
  function countdown(cur) {
    if (!cur.date) return "";
    var p = cur.date.split("-"), t = (cur.time || "00:00").split(":");
    var diff = new Date(+p[0], +p[1] - 1, +p[2], +t[0] || 0, +t[1] || 0) - Date.now();
    if (isNaN(diff) || diff < 0) return "";
    var mins = Math.floor(diff / 60000), days = Math.floor(mins / 1440), hrs = Math.floor((mins % 1440) / 60);
    if (days >= 1) return "بعد " + days + " يوم" + (hrs ? " و" + hrs + " ساعة" : "");
    if (hrs >= 1) return "بعد " + hrs + " ساعة";
    return "بعد " + Math.max(mins, 1) + " دقيقة";
  }
  function lineupText(cur) {
    var doc = cloneDoc(cur), slots = FORMATIONS[doc.formation], L = [], meta = [];
    L.push("تشكيلة المباراة" + (cur.opponent ? " ضد " + cur.opponent : ""));
    if (cur.date) meta.push(fmtDate(cur.date));
    if (cur.time) meta.push("الساعة " + cur.time);
    if (cur.venue) meta.push(cur.venue);
    if (meta.length) L.push(meta.join(" · "));
    L.push("طريقة اللعب: " + doc.formation, "الأساسيون:");
    slots.forEach(function (s, i) { var p = doc.players[i]; L.push((p.num ? p.num + " " : "") + (p.name || "—") + " (" + s[2] + ")"); });
    var subs = (cur.subs || []).filter(Boolean);
    if (subs.length) { L.push("البدلاء:"); subs.forEach(function (x) { L.push(x); }); }
    if (cur.note) L.push("كلمة المدرب: " + cur.note);
    if (cur.coach) L.push("المدرب: " + cur.coach);
    return L.join("\n");
  }
  function buildRoster(cur) {
    var doc = cloneDoc(cur), slots = FORMATIONS[doc.formation], ul = h("ul", { class: "roster" });
    slots.forEach(function (s, i) {
      var p = doc.players[i];
      ul.appendChild(h("li", null, [h("span", { class: "rn", text: p.num || "–" }), h("span", { class: "rname", text: p.name || "—" }), h("span", { class: "muted", text: s[2] })]));
    });

      try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(done, fallback); return; } } catch (e) {}

  }

  /* ---------- coach editor ---------- */

  function squareJpeg(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var S = 256, c = document.createElement("canvas");
        c.width = S; c.height = S;
        var side = Math.min(img.width, img.height);
        var sy = img.height > img.width ? 0 : (img.height - side) / 2;
        c.getContext("2d").drawImage(img, (img.width - side) / 2, sy, side, side, 0, 0, S, S);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL("image/jpeg", 0.8));
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("img")); };
      img.src = url;
    });
  }

  function buildEditor() {

    if (assetsNs) {

      var cpPrev = h("div", { class: "photo-cell" });
      var drawCp = function () {
        cpPrev.textContent = "";
        if (draft.coachPhoto) cpPrev.appendChild(h("img", { class: "coach-img", style: "width:56px;height:56px", src: draft.coachPhoto, alt: "" }));
        cpPrev.appendChild(h("button", { type: "button", text: draft.coachPhoto ? "تغيير صورة المدرب" : "إضافة صورة المدرب", onclick: function () { cpFile.click(); } }));
        if (draft.coachPhoto) cpPrev.appendChild(h("button", { type: "button", class: "x", title: "إزالة", "aria-label": "إزالة صورة المدرب", text: "×", style: "width:1.7rem;height:1.7rem;padding:0;color:var(--danger)", onclick: function () { draft.coachPhoto = ""; drawCp(); } }));
      };

          draft.coachPhoto = r.id; setMsg(""); drawCp();

      });

      editorEl.appendChild(h("div", { class: "f", style: "display:flex;flex-direction:column;gap:6px" }, [h("span", { class: "muted", style: "font-size:.88rem", text: "صورة المدرب" }), cpPrev, cpFile]));
    }

    var sel = h("select", { id: "fForm", style: "background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%" });
    Object.keys(FORMATIONS).forEach(function (k) {

      sel.appendChild(o);
    });

    ]);

    editorEl.appendChild(acts);

  }
  function buildRows() {
    var rows = document.getElementById("rows");
    rows.textContent = "";
    rows.appendChild(h("span", { class: "muted", text: assetsNs ? "اللاعبون الأساسيون (من الحارس إلى الهجوم) مع صورة لكل لاعب" : "اللاعبون الأساسيون (من الحارس إلى الهجوم)" }));
    var slots = FORMATIONS[draft.formation];
    slots.forEach(function (s, i) {
      var num = h("input", { class: "num", inputmode: "numeric", maxlength: "2", placeholder: "رقم", "aria-label": "رقم اللاعب " + (i + 1), value: draft.players[i].num });
      var nm = h("input", { placeholder: "اسم اللاعب", "aria-label": "اسم اللاعب " + (i + 1), value: draft.players[i].name });
      num.addEventListener("input", function () { draft.players[i].num = num.value.replace(/\D/g, "").slice(0, 2); refreshPitch(); });
      nm.addEventListener("input", function () { draft.players[i].name = nm.value; refreshPitch(); });
      var cell = h("div", { class: "photo-cell" });
      if (assetsNs) {
        var file = h("input", { type: "file", accept: "image/*", hidden: "", id: "ph" + i, "aria-label": "صورة اللاعب " + (i + 1) });
        var pb = h("button", { type: "button", title: "صورة اللاعب", "aria-label": "اختيار صورة اللاعب " + (i + 1) });
        if (draft.players[i].photo) pb.appendChild(h("img", { src: draft.players[i].photo, alt: "" })); else pb.textContent = "صورة";
        pb.addEventListener("click", function () { file.click(); });
        file.addEventListener("change", function () {
          var f = file.files && file.files[0];
          if (!f) return;
          setMsg("جارٍ رفع الصورة…");
          squareJpeg(f).then(function (blob) { return assetsNs.upload(blob); }).then(function (r) {
            draft.players[i].photo = r.id; setMsg(""); buildRows(); refreshPitch();
          }, function () { setMsg("تعذّر رفع الصورة. جرّب صورة أخرى.", true); });
        });
        cell.appendChild(file); cell.appendChild(pb);
        if (draft.players[i].photo) cell.appendChild(h("button", { type: "button", class: "x", title: "إزالة الصورة", "aria-label": "إزالة صورة اللاعب " + (i + 1), text: "×", onclick: function () { draft.players[i].photo = ""; buildRows(); refreshPitch(); } }));
      }
      rows.appendChild(h("div", { class: "row" }, [h("span", { class: "role", text: s[2] }), num, nm, cell]));
    });
  }
  function cancelEdit() { editing = false; draft = null; render(); }

  editorEl.addEventListener("submit", function (e) {
    e.preventDefault();
    if (saving) return;
    var filled = draft.players.some(function (p) { return p.num || p.name || p.photo; });
    if (!filled) { setMsg("اكتب لاعبا واحدا على الأقل قبل النشر.", true); return; }
    saving = true;
    document.getElementById("saveBtn").disabled = true;
    setMsg("جارٍ النشر…");
    var id = (draft.id && draft.id !== "default") ? draft.id : "m" + Date.now();
    var data = {
      formation: draft.formation, players: draft.players.slice(0, FORMATIONS[draft.formation].length), subs: draft.subs, opponent: draft.opponent.trim(),
      date: draft.date, time: draft.time, venue: draft.venue.trim(), note: draft.note.trim(), coach: draft.coach.trim(), coachPhoto: draft.coachPhoto
    };
    api("PUT", "/api/lineups/" + id, data).then(function () {
      refreshLineups(false);
      saving = false; editing = false; draft = null; selectedId = id; notice = "تم نشر التشكيلة. يراها اللاعبون الآن."; render(); window.scrollTo(0, 0);
    }, function (err) {
      saving = false;
      var b = document.getElementById("saveBtn"); if (b) b.disabled = false;
      if (err && err.status === 401) { setToken(null); editing = false; draft = null; render(); return; }
      setMsg("تعذّر النشر. تحقق من الإنترنت وأعد المحاولة.", true);
    });
  });

  function onDelete() {
    var btn = document.getElementById("delBtn");
    if (!delArmed) {
      delArmed = true; btn.textContent = "اضغط مرة أخرى لتأكيد الحذف";
      clearTimeout(delTimer);
      delTimer = setTimeout(function () { delArmed = false; if (btn) btn.textContent = "حذف"; }, 4000);
      return;
    }
    if (saving) return;
    saving = true; btn.disabled = true;
    api("DELETE", "/api/lineups/" + draft.id).then(function () {
      saving = false; editing = false; draft = null; selectedId = null; refreshLineups(false); render();
    }, function (err) {
      saving = false; btn.disabled = false;
      if (err && err.status === 401) { setToken(null); editing = false; draft = null; render(); return; }
      setMsg("تعذّر الحذف.", true);
    });
  }

  /* ---------- coach password gate ---------- */
  function panelMsg(text) { viewEl.appendChild(h("div", { class: "panel empty-state" }, [h("p", { text: text })])); }
  function renderGate() {
    viewEl.textContent = "";
    if (dbFailed) { panelMsg("تعذّر الاتصال بالخادم. تحقق من الإنترنت ثم اضغط «تحديث»."); return; }
    if (hasPassword === null) { panelMsg("جارٍ التحميل…"); return; }
    var creating = !hasPassword || changingPw;
    var pw = h("input", { id: "gPw", type: "password", autocomplete: creating ? "new-password" : "current-password" });
    var pw2 = creating ? h("input", { id: "gPw2", type: "password", autocomplete: "new-password" }) : null;
    var msg = h("p", { class: "msg", role: "status" });
    function say(t, err) { msg.textContent = t; msg.className = "msg" + (err ? " err" : ""); }
    var actions = [h("button", { type: "submit", class: "primary", text: creating ? "حفظ كلمة السر" : "دخول" })];
    if (changingPw) actions.push(h("button", { type: "button", text: "إلغاء", onclick: function () { changingPw = false; render(); } }));
    var form = h("form", { class: "panel editor" }, [
      h("h2", { text: creating ? (changingPw ? "كلمة سر جديدة" : "أنشئ كلمة سر المدرب") : "دخول المدرب" }),
      h("label", { class: "f", for: "gPw" }, [h("span", { text: creating ? "كلمة السر (4 أحرف على الأقل)" : "كلمة السر" }), pw]),
      pw2 ? h("label", { class: "f", for: "gPw2" }, [h("span", { text: "أعد كتابتها" }), pw2]) : null,
      h("div", { class: "actions" }, actions),
      msg
    ]);
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      if (saving) return;
      if (creating) {
        if (pw.value.length < 4) { say("كلمة السر قصيرة. اكتب 4 أحرف على الأقل.", true); return; }
        if (pw.value !== pw2.value) { say("كلمتا السر غير متطابقتين.", true); return; }
        saving = true; say("جارٍ الحفظ…");
        var call = changingPw ? api("POST", "/api/password", { password: pw.value }) : api("POST", "/api/setup", { password: pw.value });
        call.then(function (d) {
          saving = false;
          if (d.token) setToken(d.token);
          hasPassword = true; changingPw = false; render();
        }, function (err) {
          saving = false;
          if (err && err.status === 401) { setToken(null); changingPw = false; render(); return; }
          say(err && err.status === 409 ? "تم تعيين كلمة سر من قبل. أعد تحميل الصفحة وسجّل الدخول." : "تعذّر الحفظ. أعد المحاولة.", true);
        });
      } else {
        saving = true; say("جارٍ التحقق…");
        api("POST", "/api/login", { password: pw.value }).then(function (d) {
          saving = false; setToken(d.token); render();
        }, function (err) {
          saving = false;
          say(err && err.status === 401 ? "كلمة السر غير صحيحة." : "تعذّر الاتصال. أعد المحاولة.", true);
          if (err && err.status === 401) pw.select();
        });
      }
    });
    viewEl.appendChild(form);
  }

  /* ---------- boot ---------- */
  try { if (location.hash === "#coach") screen = "coach"; else if (location.hash === "#player") screen = "player"; } catch (e) {}
  render();
  refreshLineups(false);
  setInterval(function () { if (!document.hidden && screen !== "home" && !editing) refreshLineups(false); }, 15000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden && screen !== "home" && !editing) refreshLineups(false); });
})();
</script>
</body>
</html>
